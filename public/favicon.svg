  <!-- Líneas de celda -->
  <line x1="10" y1="11" x2="26" y2="11" stroke="#1D6F42" stroke-width="0.8"/>
  <line x1="10" y1="15" x2="26" y2="15" stroke="#1D6F42" stroke-width="0.8"/>
  <line x1="10" y1="19" x2="26" y2="19" stroke="#1D6F42" stroke-width="0.8"/>
  <line x1="17" y1="8" x2="17" y2="24" stroke="#1D6F42" stroke-width="0.8"/>
